services:
  - type: web
    name: maw3idi
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false
  - type: cron
    name: maw3idi-reminders
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run reminders
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false
